app = "saans-lahore"
primary_region = "sin"

[build]

[env]
  DATABASE_URL = "sqlite:////data/saans.db"
  BULLETIN_STORAGE_DIR = "/data/bulletins"
  FRONTEND_BASE_URL = "https://saans.vercel.app"
  OPENMETEO_BASE_URL = "https://api.open-meteo.com/v1"

[mounts]
  source = "saans_data"
  destination = "/data"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "4s"
    grace_period = "10s"

[[services.http_checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"
